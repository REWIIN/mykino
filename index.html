<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUSTRA</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#141414;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#top{height:80px;flex:none;display:flex;align-items:center;padding:0 60px}
#logo{font-size:40px;font-weight:bold;color:#e50914;letter-spacing:4px}
#info{height:200px;flex:none;padding:0 60px;overflow:hidden}
#itTitle{font-size:44px;font-weight:bold;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#itYear{font-size:24px;color:#aaa;margin-bottom:10px;height:30px}
#itDesc{font-size:24px;line-height:32px;color:#ddd;max-height:128px;overflow:hidden}
#wrap{flex:1;position:relative;overflow:hidden;padding:0 46px}
#cards{display:flex;flex-wrap:wrap;padding-top:24px;padding-bottom:240px}
.card{width:200px;margin:0 14px 28px;flex:none;transition:transform .15s}
.poster{width:200px;height:300px;box-sizing:border-box;border:4px solid transparent;background:#2a2a2a;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ctitle{margin-top:10px;font-size:20px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focus{transform:scale(1.08)}
.card.focus .poster{border-color:#fff}
.card.focus .ctitle{color:#fff}
#msg{display:none;position:fixed;left:0;right:0;top:45%;text-align:center;font-size:36px;z-index:20;text-shadow:0 0 10px #000}
#player{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:10}
#player.on{display:block}
#vid{width:100%;height:100%;background:#000;display:block}
#ovl{position:absolute;left:0;right:0;bottom:0;padding:40px 60px;background:rgba(0,0,0,.75);opacity:0;transition:opacity .3s}
#ovl.on{opacity:1}
#pTitle{font-size:32px}
#pBar{height:8px;background:#555;margin-top:16px}
#pFill{height:8px;background:#e50914;width:0}
#pTime{font-size:24px;color:#ccc;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="logo">LUSTRA</div></div>
  <div id="info">
    <div id="itTitle"></div>
    <div id="itYear"></div>
    <div id="itDesc"></div>
  </div>
  <div id="wrap"><div id="cards"></div></div>
</div>
<div id="msg"></div>
<div id="player">
  <video id="vid"></video>
  <div id="ovl">
    <div id="pTitle"></div>
    <div id="pBar"><div id="pFill"></div></div>
    <div id="pTime"></div>
  </div>
</div>

<script>
var items = [];
var cur = 0;
var inPlayer = false;
var ovlTimer = null;

var elCards = document.getElementById('cards');
var elWrap = document.getElementById('wrap');
var elMsg = document.getElementById('msg');
var vid = document.getElementById('vid');
var elPlayer = document.getElementById('player');
var elOvl = document.getElementById('ovl');

function showMsg(t) {
  if (t) { elMsg.textContent = t; elMsg.style.display = 'block'; }
  else { elMsg.style.display = 'none'; }
}

function getJSON(url, cb) {
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.timeout = 20000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300) {
      try { cb(null, JSON.parse(x.responseText)); }
      catch (e) { cb('parse'); }
    } else { cb('http ' + x.status); }
  };
  x.ontimeout = function () { cb('timeout'); };
  x.send();
}

function clean(s) {
  if (s instanceof Array) s = s.join(' ');
  s = String(s || '');
  s = s.replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
       .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ');
  s = s.replace(/^\s+|\s+$/g, '');
  if (s.length > 400) s = s.substring(0, 400) + '...';
  return s;
}

function first(v) {
  if (v instanceof Array) return v[0];
  return v;
}

function loadCatalog() {
  showMsg('Загрузка каталога...');
  var q = 'collection:feature_films AND mediatype:movies';
  var url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q) +
    '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&fl%5B%5D=description' +
    '&sort%5B%5D=downloads%20desc&rows=48&page=1&output=json';
  getJSON(url, function (err, data) {
    if (err || !data || !data.response) {
      showMsg('Не удалось загрузить каталог (' + err + '). Нажмите OK, чтобы повторить.');
      return;
    }
    showMsg('');
    var docs = data.response.docs;
    items = [];
    for (var i = 0; i < docs.length; i++) {
      var d = docs[i];
      items.push({
        id: d.identifier,
        title: clean(first(d.title)) || d.identifier,
        year: first(d.year) || '',
        desc: clean(d.description) || 'Описание пока недоступно.',
        poster: 'https://archive.org/services/img/' + d.identifier
      });
    }
    renderCards();
    setFocus(0);
  });
}

function renderCards() {
  elCards.innerHTML = '';
  for (var i = 0; i < items.length; i++) {
    var c = document.createElement('div');
    c.className = 'card';
    var p = document.createElement('div');
    p.className = 'poster';
    var img = document.createElement('img');
    img.src = items[i].poster;
    img.onerror = function () { this.style.display = 'none'; };
    p.appendChild(img);
    var t = document.createElement('div');
    t.className = 'ctitle';
    t.textContent = items[i].title;
    c.appendChild(p);
    c.appendChild(t);
    elCards.appendChild(c);
  }
}

function setFocus(n) {
  if (!items.length) return;
  if (n < 0) n = 0;
  if (n > items.length - 1) n = items.length - 1;
  var cards = elCards.children;
  if (cards[cur]) cards[cur].className = 'card';
  cur = n;
  var el = cards[cur];
  el.className = 'card focus';
  document.getElementById('itTitle').textContent = items[cur].title;
  document.getElementById('itYear').textContent = items[cur].year;
  document.getElementById('itDesc').textContent = items[cur].desc;
  var top = el.offsetTop;
  var bottom = top + el.offsetHeight + 30;
  if (top < elWrap.scrollTop) elWrap.scrollTop = top - 24;
  else if (bottom > elWrap.scrollTop + elWrap.clientHeight) elWrap.scrollTop = bottom - elWrap.clientHeight + 24;
}

function columns() {
  var cards = elCards.children;
  if (!cards.length) return 1;
  var t = cards[0].offsetTop, n = 0;
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].offsetTop === t) n++; else break;
  }
  return n || 1;
}

function fmt(s) {
  if (!s || isNaN(s)) s = 0;
  s = Math.floor(s);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ':' : '') + (m < 10 && h ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
}

function showOvl() {
  elOvl.className = 'on';
  if (ovlTimer) clearTimeout(ovlTimer);
  ovlTimer = setTimeout(function () { elOvl.className = ''; }, 4000);
}

function updateBar() {
  var d = vid.duration || 0;
  var t = vid.currentTime || 0;
  document.getElementById('pFill').style.width = (d ? (t / d * 100) : 0) + '%';
  document.getElementById('pTime').textContent = fmt(t) + ' / ' + fmt(d);
}

function pickFile(files) {
  var best = null, any = null, i, f;
  for (i = 0; i < files.length; i++) {
    f = files[i];
    if (!f.name || !/\.mp4$/i.test(f.name)) continue;
    if (!any) any = f;
    if (String(f.format).toLowerCase() === 'h.264' && !best) best = f;
  }
  return best || any;
}

function openPlayer(item) {
  showMsg('Подготовка видео...');
  getJSON('https://archive.org/metadata/' + item.id, function (err, data) {
    if (err || !data || !data.files) { showMsg('Ошибка: ' + err); setTimeout(function () { showMsg(''); }, 3000); return; }
    var f = pickFile(data.files);
    if (!f) { showMsg('У этого фильма нет MP4-файла'); setTimeout(function () { showMsg(''); }, 3000); return; }
    var parts = f.name.split('/');
    for (var i = 0; i < parts.length; i++) parts[i] = encodeURIComponent(parts[i]);
    var url = 'https://archive.org/download/' + item.id + '/' + parts.join('/');
    inPlayer = true;
    elPlayer.className = 'on';
    document.getElementById('pTitle').textContent = item.title;
    vid.src = url;
    vid.play();
    showMsg('Загрузка видео...');
    showOvl();
  });
}

function closePlayer() {
  inPlayer = false;
  vid.pause();
  vid.removeAttribute('src');
  vid.load();
  elPlayer.className = '';
  elOvl.className = '';
  showMsg('');
}

vid.addEventListener('playing', function () { showMsg(''); });
vid.addEventListener('waiting', function () { showMsg('Буферизация...'); });
vid.addEventListener('timeupdate', updateBar);
vid.addEventListener('error', function () { showMsg('Не удалось воспроизвести это видео'); });
vid.addEventListener('ended', closePlayer);

function seek(sec) {
  var t = (vid.currentTime || 0) + sec;
  if (t < 0) t = 0;
  vid.currentTime = t;
  showOvl();
}

function togglePlay() {
  if (vid.paused) vid.play(); else vid.pause();
  showOvl();
}

document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (inPlayer) {
    if (k === 10009 || k === 8 || k === 27 || k === 413) { closePlayer(); }
    else if (k === 13 || k === 32 || k === 10252) { togglePlay(); }
    else if (k === 415) { vid.play(); showOvl(); }
    else if (k === 19) { vid.pause(); showOvl(); }
    else if (k === 37) { seek(-10); }
    else if (k === 39) { seek(10); }
    else if (k === 412) { seek(-30); }
    else if (k === 417) { seek(30); }
    else if (k === 38 || k === 40) { showOvl(); }
    else { return; }
    e.preventDefault();
    return;
  }
  if (!items.length) {
    if (k === 13) loadCatalog();
    return;
  }
  var cols = columns();
  if (k === 37) setFocus(cur - 1);
  else if (k === 39) setFocus(cur + 1);
  else if (k === 38) setFocus(cur - cols);
  else if (k === 40) setFocus(cur + cols > items.length - 1 ? items.length - 1 : cur + cols);
  else if (k === 13) openPlayer(items[cur]);
  else return;
  e.preventDefault();
});

try {
  if (window.tizen && tizen.tvinputdevice) {
    var keys = ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaFastForward', 'MediaRewind', 'MediaStop'];
    for (var i = 0; i < keys.length; i++) {
      try { tizen.tvinputdevice.registerKey(keys[i]); } catch (e) {}
    }
  }
} catch (e) {}

loadCatalog();
</script>
</body>
</html>
